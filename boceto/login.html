<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Image Bio Pro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div id="menu"></div>

  <main class="contenedor">
    <div class="migas"><a href="index.html">Inicio</a> &rsaquo; Iniciar sesión</div>
    <h1 class="titulo-pagina">Mi cuenta</h1>

    <div class="row g-5">
      <div class="col-md-6">
        <div class="titulo-bloque mt-0"><span>Iniciar sesión</span></div>
        <div class="mb-3">
          <label class="form-label" for="correo-entrar">Correo electrónico</label>
          <input class="form-control" id="correo-entrar" type="email">
        </div>
        <div class="mb-3">
          <label class="form-label" for="clave-entrar">Contraseña</label>
          <input class="form-control" id="clave-entrar" type="password">
        </div>
        <a class="btn btn-ibp" href="ia.html">Entrar</a>
      </div>
      <div class="col-md-6">
        <div class="titulo-bloque mt-0"><span>Crear cuenta</span></div>
        <div class="mb-3">
          <label class="form-label" for="nombre-nuevo">Nombre</label>
          <input class="form-control" id="nombre-nuevo" type="text">
        </div>
        <div class="mb-3">
          <label class="form-label" for="correo-nuevo">Correo electrónico</label>
          <input class="form-control" id="correo-nuevo" type="email">
        </div>
        <div class="mb-3">
          <label class="form-label" for="clave-nueva">Contraseña</label>
          <input class="form-control" id="clave-nueva" type="password">
        </div>
        <button class="btn btn-borde" type="button">Registrarme</button>
      </div>
    </div>
    <p class="nota mt-4">Nota: cada quien ve solo sus propios análisis.</p>
  </main>

  <div id="pie"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="menu.js"></script>
</body>
</html>
