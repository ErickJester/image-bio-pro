# Configuración de producción: HTTPS con el certificado de Let's Encrypt para imagebiopro.cloud.
# Si el certificado todavía no existe, Nginx no arranca: en un servidor nuevo se usa primero
# nginx-http.conf (ver docs/despliegue.md). Con otro dominio, cambiar los nombres en este archivo.

# El puerto 80 solo valida el dominio con Certbot y manda todo lo demás a HTTPS
server {
    listen 80;
    server_name imagebiopro.cloud www.imagebiopro.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://imagebiopro.cloud$request_uri;
    }
}

# www también va al dominio sin www
server {
    listen 443 ssl;
    http2 on;
    server_name www.imagebiopro.cloud;

    ssl_certificate     /etc/letsencrypt/live/imagebiopro.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imagebiopro.cloud/privkey.pem;

    return 301 https://imagebiopro.cloud$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name imagebiopro.cloud;

    ssl_certificate     /etc/letsencrypt/live/imagebiopro.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imagebiopro.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Hasta 10 imágenes BMP sin compresión (igual que MAX_CONTENT_LENGTH)
    client_max_body_size 300m;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Analizar 10 imágenes con los modelos puede tardar varios minutos (igual que --timeout de Gunicorn)
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
