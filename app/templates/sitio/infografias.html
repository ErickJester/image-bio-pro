{% extends "base.html" %}

{% block titulo %}Infografías{% endblock %}

{% block contenido %}
  <nav class="migas" aria-label="Ruta de navegación"><ol><li><a href="{{ url_for('sitio.inicio') }}">Inicio</a></li><li aria-current="page"><span>Infografías</span></li></ol></nav>
  <h1 class="titulo-pagina">Infografías</h1>

  <div class="row g-3">
    {% for info in infografias %}
      {% with abrir_ventana = true %}{% include "sitio/_infografia.html" %}{% endwith %}
    {% endfor %}
  </div>

  <div class="modal fade" id="ventana" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="ventana-titulo"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3" id="ventana-imagen"></div>
          <p class="mb-0" id="ventana-texto"></p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
